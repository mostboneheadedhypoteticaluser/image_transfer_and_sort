[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-sortierer"
version = "0.1.0"
description = "Lokaler, modularer Bildkatalog als Basis fuer spaetere Personen- und Haustiererkennung."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "Pillow>=11,<13",
]

[project.scripts]
image-sortierer = "image_sortierer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
