name: Build check

on:
  push:
    branches:
      - "2026-10-01-electron-worker-neustart"
      - "2026-10-01-verschieben-papierkorb"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
