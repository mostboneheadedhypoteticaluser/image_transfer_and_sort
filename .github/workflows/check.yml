name: Build check

on:
  push:
    branches:
      - "2026-10-01-electron-worker-neustart"
      - "2026-10-01-verschieben-papierkorb"
      - "2026-10-01-videos-datenbank-reset"
      - "2026-10-02-motiverkennung-ensemble-suche"
      - "2026-10-06-personen-haustier-zaehler"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Check AI setup script
        run: node --check scripts/setup-ai.mjs

      - name: Check Python worker syntax
        run: python3 -m py_compile workers/python-ai/worker.py

      - name: Build
        run: npm run build
